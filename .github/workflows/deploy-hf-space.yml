name: Deploy to Hugging Face Space

# Manually triggered. The HF token is supplied as a MASKED workflow input
# (masked in logs via ::add-mask::, never written into the repo). Use a
# throwaway token and revoke it after the run completes.

on:
  workflow_dispatch:
    inputs:
      hf_token:
        description: "Hugging Face write token (masked)"
        required: true
      space_name:
        description: "Space name under your HF account"
        required: false
        default: "ml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Mask token in logs
        run: echo "::add-mask::${{ github.event.inputs.hf_token }}"

      - name: Checkout app files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hugging Face Hub
        run: pip install --upgrade huggingface_hub

      - name: Create Space and upload files
        env:
          HF_TOKEN: ${{ github.event.inputs.hf_token }}
          SPACE_NAME: ${{ github.event.inputs.space_name }}
        run: |
          python - <<'PY'
          import os, sys
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN")
          if not token:
              sys.exit("ERROR: no token provided")

          api = HfApi(token=token)
          user = api.whoami()["name"]
          repo_id = f"{user}/{os.environ['SPACE_NAME']}"
          print("Target Space:", repo_id)

          api.create_repo(
              repo_id=repo_id,
              repo_type="space",
              space_sdk="gradio",
              exist_ok=True,
              private=False,
          )

          for fname in ["app.py", "insurance.csv", "requirements.txt", "README.md"]:
              api.upload_file(
                  path_or_fileobj=fname,
                  path_in_repo=fname,
                  repo_id=repo_id,
                  repo_type="space",
              )
              print("uploaded", fname)

          print(f"DEPLOYED: https://huggingface.co/spaces/{repo_id}")
          PY
