name: Deploy to Hugging Face Space

# Manually triggered. Reads the HF write token from the repository secret
# HF_TOKEN (encrypted by GitHub, masked in logs, never exposed). Add it at:
# Settings > Secrets and variables > Actions > New repository secret.

on:
  workflow_dispatch:
    inputs:
      space_name:
        description: "Space name under your HF account"
        required: false
        default: "ml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hugging Face Hub
        run: pip install --upgrade huggingface_hub

      - name: Create Space and upload files
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_NAME: ${{ github.event.inputs.space_name }}
        run: |
          python - <<'PY'
          import os, sys
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN")
          if not token:
              sys.exit("ERROR: HF_TOKEN secret is not set. Add it in "
                       "Settings > Secrets and variables > Actions.")

          api = HfApi(token=token)
          user = api.whoami()["name"]
          repo_id = f"{user}/{os.environ['SPACE_NAME']}"
          print("Target Space:", repo_id)

          api.create_repo(
              repo_id=repo_id,
              repo_type="space",
              space_sdk="gradio",
              exist_ok=True,
              private=False,
          )

          for fname in ["app.py", "insurance.csv", "requirements.txt", "README.md"]:
              api.upload_file(
                  path_or_fileobj=fname,
                  path_in_repo=fname,
                  repo_id=repo_id,
                  repo_type="space",
              )
              print("uploaded", fname)

          print(f"DEPLOYED: https://huggingface.co/spaces/{repo_id}")
          PY
